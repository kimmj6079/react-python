# CD 워크플로우: main에 push될 때마다 backend/frontend 이미지를 빌드해서
# GHCR(GitHub Container Registry)에 push한다. 딱 여기까지만 하고, 실제
# 클러스터에 반영(배포)하지는 않는다 -- 그건 로컬에서 scripts/deploy-local.*
# (minikube/kind) 또는 scripts/deploy-prod.*(클라우드 VM)를 수동 실행해야 한다.
# 이유: GitHub이 제공하는 러너는 개발자의 로컬 클러스터나 VM에 네트워크로
# 접근할 수 없기 때문.
name: CD

# main으로 push될 때만 실행된다 (ci.yml과 달리 PR에는 반응하지 않음).
on:
  push:
    branches: [main]

# GITHUB_TOKEN이 이 워크플로우 안에서 가질 권한 범위.
# packages: write가 있어야 GHCR에 이미지를 push할 수 있다.
permissions:
  contents: read
  packages: write

# 아래 step들에서 반복 사용할 값들을 변수로 미리 뽑아둔 것.
# github.repository_owner는 이 저장소의 소유자(계정명)로 자동 치환된다.
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/react-python-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/react-python-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # 저장소 코드를 러너로 체크아웃

      - uses: docker/setup-buildx-action@v3   # BuildKit 기반 빌더 설정 (캐시/멀티플랫폼 빌드 지원)

      # ghcr.io에 로그인. 별도로 발급받은 비밀번호가 아니라, GitHub Actions가
      # 매 실행마다 자동 발급하는 임시 토큰(GITHUB_TOKEN)을 그대로 쓴다.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # backend 이미지를 빌드해서 바로 push까지 한다 (build-push-action은
      # docker build + docker push를 한 스텝으로 묶어서 처리).
      # 태그를 2개 붙인다: :latest(가장 최근 것을 가리키는 이동 태그)와
      # :sha-<커밋SHA>(그 시점 커밋을 정확히 가리키는 고정 태그, 롤백/추적용).
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      # frontend도 동일하되, target: production으로 멀티스테이지 Dockerfile 중
      # nginx가 정적 파일을 서빙하는 최종 스테이지만 빌드한다(dev 스테이지 제외).
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

      # 실제 배포 액션은 없고, 다음에 뭘 해야 하는지 로그에 안내만 남긴다.
      # (로컬 minikube/kind는 deploy-local.*, 클라우드 VM은 deploy-prod.*)
      - name: Local cluster deploy reminder
        run: |
          echo "Images pushed to GHCR. GitHub-hosted runners cannot reach a"
          echo "developer's local minikube/kind cluster, so applying them"
          echo "there is a manual step. Run locally:"
          echo "  ./scripts/deploy-local.sh   (or deploy-local.ps1 on Windows)"
