# RAG 평가 워크플로. (M13-d)
#
# ★★ ci.yml과 일부러 분리했다 ★★
# chatbot/README.md 맨 앞에서 정한 원칙이다: "평가를 ci.yml의 pytest에 넣지 않는다."
# 이유 세 가지이고, 셋 다 혼자서도 분리할 이유가 된다.
#   1. 비용    — 생성 평가는 실제 Anthropic API를 부른다. PR마다 돌면 PR마다 돈이 든다.
#   2. 시크릿  — 포크에서 온 PR에는 시크릿이 전달되지 않는다. ci.yml에 넣으면
#                외부 기여자의 PR이 "내 코드와 무관한 이유로" 빨개진다.
#   3. 플래키  — LLM 채점은 확률적이다. 확률적인 판정이 머지를 막기 시작하면
#                사람들은 그 판정을 재실행으로 우회하는 법부터 배운다.
# 대신 여기서 **야간 스케줄 + 수동 실행**으로 돌리고, 검색 지표만 임계값으로 막는다.
#
# ★ 처음 켤 때 반드시 실패한다 ★ 기준선(backend/evals/thresholds.json)이
# 기록돼 있지 않으면 게이트는 "통과"가 아니라 "고장"으로 판정한다. 먼저 로컬에서
# 한 번 기록하고 커밋한다:
#   docker compose up -d qdrant
#   cd backend
#   uv run python -m app.rag.ingest --store qdrant ../CLAUDE.md ../SETUP.md ../DEPLOYMENT.md
#   uv run python -m evals.run_retrieval --store qdrant --no-rewrite --write-baseline
name: Evals

on:
  # 손으로 돌리는 경로. 생성 평가(유료)는 여기서만 켤 수 있다.
  workflow_dispatch:
    inputs:
      run_judge:
        description: "생성 평가(LLM-as-judge)도 돌린다 — ★ 실제 Anthropic API 비용이 발생한다 ★"
        type: boolean
        default: false
  # 야간 스케줄. UTC 기준이라 한국시간(UTC+9)으로는 매일 오전 9시다.
  # ★ 주의 ★ GitHub은 60일 동안 저장소에 활동이 없으면 스케줄 워크플로를 자동으로
  # 끈다. 조용한 저장소에서 "왜 야간 실행이 멈췄지"의 가장 흔한 원인이다.
  schedule:
    - cron: "0 0 * * *"

# 야간 실행과 수동 실행이 겹치면 같은 Qdrant를 두 벌이 쓰는 것은 아니지만(잡마다
# 독립 컨테이너다) 무료 러너 시간을 두 배로 쓴다. 나중 것만 남긴다.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 검색 평가 — ★ 크레딧이 0원이어도 돌아간다 ★
  # 임베딩은 로컬 fastembed(CPU)라 API를 안 부른다. 그래서 이 잡만 스케줄로 자동
  # 실행하고, 임계값으로 머지를 막을 자격이 있다.
  #
  # ★★ "결정론적"은 공짜로 주어지지 않았다 (M5에서 고침) ★★
  # 이 게이트를 만들고 기준선을 기록한 직후 --check를 돌렸더니 **아무것도 안 바꿨는데
  # 숫자가 달랐다.** 원인은 RRF 동점이었다 — 점수가 순위의 역수 합이라 "dense 3등"과
  # "sparse 3등"이 같은 점수를 받고, 그 순서를 Qdrant의 세그먼트 순회가 정한다.
  # 10회 측정에서 29개 질문 중 19개가 흔들렸고 지표 폭이 허용 노이즈(±0.02)를 넘었다.
  # app/rag/qdrant_store.py의 stable_order()로 고쳐 폭이 정확히 0이 됐다.
  # **게이트를 만들면서 그 게이트를 못 믿게 만들 뻔한 자리**라 여기 적어둔다.
  #
  # 남은 한계: 말뭉치가 커져 HNSW 근사 탐색이 실제로 작동하기 시작하면 후보 집합
  # 자체가 흔들릴 수 있다(지금은 143청크라 사실상 전수 스캔이다). 그때는 tolerance를
  # 실측으로 다시 정해야 한다 — 추측으로 넓히면 진짜 회귀를 놓친다.
  # ---------------------------------------------------------------------------
  retrieval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # 벡터 저장소. Postgres가 아니라 Qdrant인 이유: M8의 하이브리드 검색(dense+BM25
      # RRF)은 Qdrant 기능이고, 프로덕션 기본값도 qdrant다(app/core/config.py의
      # vector_store). **평가 하네스가 프로덕션 경로를 우회하면 개선을 측정하지 못한다** —
      # M8에서 실제로 겪은 실수라 여기서는 처음부터 같은 저장소를 쓴다.
      # 컬렉션은 QdrantStore._ensure_collection이 런타임에 만든다(마이그레이션 불필요).
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    env:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://localhost:6333
      # fastembed 모델(1GB 남짓)을 워크스페이스 안에 받아 actions/cache로 재사용한다.
      # 기본값은 러너의 임시 디렉터리라 매 실행마다 다시 받는다 — 13-b에서 잰
      # "콜드 스타트 5.5~13초"가 CI에서는 "모델 다운로드 수 분"이 된다.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # 임베딩 모델 캐시. 키에 모델 이름을 넣어, embedding.py의 MODEL_NAME을 바꾸면
      # 자동으로 캐시 미스가 나게 한다 — 13-c의 임베딩 캐시 키에 모델 이름을 넣은
      # 것과 완전히 같은 이유다(안 넣으면 다른 의미 공간의 벡터를 되살려준다).
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-multilingual-e5-large

      # ★ 13-c의 임베딩 캐시를 CI에서도 쓴다 ★ 실측으로 재인입 107초 → 11.5초였다.
      # 키를 문서 내용의 해시로 잡아 문서가 바뀌면 바뀐 만큼만 다시 계산하게 하고,
      # restore-keys로 "가장 최근 캐시에서 출발"하게 한다 — 문서 한 줄을 고쳤을 때
      # 34청크 중 2개만 다시 도는 성질이 여기서 그대로 회수된다.
      - name: Cache the embedding results
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: embed-cache-${{ hashFiles('CLAUDE.md', 'SETUP.md', 'DEPLOYMENT.md') }}
          restore-keys: embed-cache-

      - run: uv sync --frozen

      # 서비스 컨테이너는 "떴다"와 "받을 준비가 됐다"가 다르다. Qdrant 이미지에는
      # curl이 없어서 services의 --health-cmd를 쓸 수 없으므로(러너가 아니라 컨테이너
      # 안에서 도는 명령이다) 러너 쪽에서 기다린다.
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              echo "Qdrant ready"; exit 0
            fi
            sleep 2
          done
          echo "Qdrant가 60초 안에 뜨지 않았다"; exit 1

      # ★ 인입은 자동이 아니다 — 여기서도 명시적 단계다 ★ 로컬·k8s와 같은 원칙이고
      # (CLAUDE.md의 "마이그레이션은 절대 자동 실행되지 않는다"), CI에서는 매 실행이
      # 빈 Qdrant에서 시작하므로 반드시 한 번 돌려야 한다.
      - name: Ingest the docs
        run: uv run python -m app.rag.ingest --store qdrant ../CLAUDE.md ../SETUP.md ../DEPLOYMENT.md

      # ★ --no-rewrite가 핵심이다 ★ 질의 재작성은 LLM을 부른다(multiturn 케이스만).
      # 끄지 않으면 이 "무료" 잡이 조용히 유료가 되고, 키가 없으면 실패한다.
      # 그 대가로 multiturn 지표는 의미를 잃는다 — 그래서 기준선에서도 빼두거나,
      # 재작성이 꺼진 상태의 낮은 값을 그대로 기준선으로 기록한다(둘 다 정직하다).
      #
      # --check가 기준선을 못 넘기면 exit 1 → 이 잡이 빨개진다.
      - name: Retrieval gate
        run: uv run python -m evals.run_retrieval --store qdrant --no-rewrite --check --save

      # ★ "이번 실행이 만든 파일"만 골라낸다 ★ evals/results/에는 M6~M13에서 커밋해둔
      # 결과가 30개 넘게 들어 있다. 통째로 올리면 아티팩트를 열었을 때 어느 것이 오늘
      # 것인지 알 수 없다. **추적되지 않는 파일(untracked) = 이번 실행이 만든 파일**이라
      # git에게 물어보는 것이 가장 정확하다(타임스탬프 비교는 체크아웃 시각 때문에 흔들린다).
      #
      # --save는 게이트 판정보다 **먼저** 돌므로(run_retrieval.main의 순서) 게이트가
      # 빨개져도 파일은 남아 있다 — 빨간불일 때 정작 필요한 것이 "어느 질문이 몇 등으로
      # 밀렸나"이고, 그게 이 파일 안에 있다.
      - name: Collect the report produced by this run
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p artifact
          git ls-files --others --exclude-standard 'backend/evals/results/*.md' \
            | xargs -r -I{} cp {} artifact/
          ls -l artifact/ || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: artifact/
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 생성 평가 — ★ 돈이 든다. 수동 실행에서 체크했을 때만 돈다 ★
  # ---------------------------------------------------------------------------
  generation:
    # 스케줄에서는 절대 안 돈다(inputs가 없으므로 조건이 거짓). 사람이 버튼을 눌러
    # 체크했을 때만이다 — "야간에 조용히 돈이 나가는" 워크플로를 만들지 않는다.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_judge }}
    # ★ 검색 게이트가 통과해야만 돈다 ★ 검색이 이미 깨진 상태에서 생성 품질을 재면
    # "답이 나빠진 이유"가 검색인지 프롬프트인지 구분할 수 없다 — M6이 두 층을 나눈
    # 이유가 그 구분이었다. 게다가 그 실행은 돈이 든다. 싼 판정을 먼저 통과시킨다.
    needs: [retrieval]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    env:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://localhost:6333
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
      # ★ 시크릿은 여기 값으로 적지 않는다 ★ GitHub Secrets에 등록하고 이름만 참조한다.
      # 등록: 저장소 Settings → Secrets and variables → Actions → New repository secret
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Langfuse 키는 선택이다. 없으면 tracing이 no-op이라 평가는 그대로 돈다
      # (core/tracing.py의 get_callbacks가 빈 리스트를 준다).
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-multilingual-e5-large

      - run: uv sync --frozen

      # 키가 없는데 잡을 돌리면 Anthropic이 401을 줄 때까지 모델 다운로드·인입을
      # 다 하고 나서 실패한다. 시작하자마자 죽는 편이 몇 분을 아낀다.
      - name: Require the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY가 GitHub Secrets에 없다 — 생성 평가는 실제 API를 부른다"
            exit 1
          fi

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null; then
              echo "Qdrant ready"; exit 0
            fi
            sleep 2
          done
          echo "Qdrant가 60초 안에 뜨지 않았다"; exit 1

      - name: Ingest the docs
        run: uv run python -m app.rag.ingest --store qdrant ../CLAUDE.md ../SETUP.md ../DEPLOYMENT.md

      # ★ 아직 임계값 게이트가 없다 ★ faithfulness 기준선을 한 번도 못 쟀기 때문이다
      # (크레딧 대기). 재고 나면 run_retrieval의 --check와 같은 구조를 여기에도 붙인다.
      # 그때까지는 "리포트를 만들어 올리는" 잡이고, 그 사실을 숨기지 않는다 —
      # 게이트가 있는 척하는 잡이 게이트가 없는 잡보다 나쁘다.
      - name: Generation eval (LLM-as-judge)
        run: uv run python -m evals.judge --store qdrant --save

      - name: Collect the report produced by this run
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p artifact
          git ls-files --others --exclude-standard 'backend/evals/results/*.md' \
            | xargs -r -I{} cp {} artifact/
          ls -l artifact/ || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-report
          path: artifact/
          retention-days: 30
          if-no-files-found: warn
