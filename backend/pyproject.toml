[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the react-python study project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "anthropic>=0.120.2",
    "langgraph>=1.2.11",
    "langchain-anthropic>=1.6.1",
    "fastembed>=0.8.0",
    "pgvector>=0.5.0",
    "qdrant-client>=1.19.0",
    "langfuse>=4.15.1",
    "langchain>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
