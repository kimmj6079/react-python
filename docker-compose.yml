# docker compose up --build                                       # db+backend+frontend 동시 기동
# docker compose run --rm backend alembic upgrade head             # 마이그레이션 수동 적용 (자동 실행 안 됨)
# docker compose down -v                                           # 컨테이너+볼륨 정리
services:	# 이 파일에서 정의할 컨테이너 서비스 목록 시작
  db:	# PostgreSQL 데이터베이스 서비스
    build:	# 이미지를 빌드해서 사용 (미리 만들어진 이미지 대신)
      context: ./postgres	# 빌드 컨텍스트 경로 (Dockerfile 위치)
    environment:	# 컨테이너 내부에 주입할 환경변수
      POSTGRES_USER: postgres	# DB 접속 계정명
      POSTGRES_PASSWORD: postgres	# DB 접속 비밀번호
      POSTGRES_DB: app	# 생성할 기본 데이터베이스 이름
    ports:	# 호스트<->컨테이너 포트 매핑
      - "5432:5432"	# 호스트 5432번 포트를 컨테이너 5432번 포트에 연결
    volumes:	# 데이터 영속화를 위한 볼륨 마운트
      - db-data:/var/lib/postgresql/data	# 명명된 볼륨을 postgres 데이터 디렉토리에 연결

  backend:	# FastAPI 백엔드 서비스
    build:	# 이미지를 빌드해서 사용
      context: ./backend	# 빌드 컨텍스트 경로
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload	# 개발 서버 실행 커맨드 (핫리로드 활성화)
    environment:	# 백엔드에 주입할 환경변수
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app	# DB 접속 문자열 (서비스명 db로 접근)
      BACKEND_CORS_ORIGINS: http://localhost:5173	# CORS 허용할 프론트엔드 origin
    volumes:	# 소스 코드 바인드 마운트 (핫리로드용)
      - ./backend/app:/app/app	# 로컬 app 디렉토리를 컨테이너에 동기화
    ports:	# 포트 매핑
      - "8000:8000"	# 호스트 8000번 포트를 컨테이너 8000번 포트에 연결
    depends_on:	# 시작 순서 의존성
      db:	# db 서비스가 준비된 후 시작
        condition: service_healthy	# db의 헬스체크가 통과해야 시작

  frontend:	# React/Vite 프론트엔드 서비스
    build:	# 이미지를 빌드해서 사용
      context: ./frontend	# 빌드 컨텍스트 경로
      target: dev	# 멀티스테이지 Dockerfile 중 dev 스테이지 사용
    environment:	# 프론트엔드에 주입할 환경변수
      VITE_API_URL: http://localhost:8000	# 빌드/개발 서버 시점에 백엔드 절대경로 주입
    volumes:	# 소스 코드 바인드 마운트 (핫리로드용)
      - ./frontend/src:/app/src	# 로컬 src 디렉토리를 컨테이너에 동기화
      - ./frontend/index.html:/app/index.html	# 로컬 index.html을 컨테이너에 동기화
      - /app/node_modules	# 컨테이너 내부 node_modules는 익명 볼륨으로 보존 (호스트 마운트로 덮어쓰지 않음)
    ports:	# 포트 매핑
      - "5173:5173"	# 호스트 5173번 포트를 컨테이너 5173번 포트에 연결
    depends_on:	# 시작 순서 의존성
      - backend	# backend 서비스가 시작된 후 시작

volumes:	# 명명된 볼륨 정의
  db-data:	# postgres 데이터 영속화용 볼륨
