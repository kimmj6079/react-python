# 문서 인입 Job. (M5)
#
# ★ 왜 Job인가 — 마이그레이션과 완전히 같은 이유다 ★
# CLAUDE.md가 "마이그레이션은 절대 컨테이너 시작 시 자동 실행되지 않는다"고 못 박은 것과
# 같은 판단이다. 인입은 (a) 몇 분이 걸리고 (b) 저장소의 내용을 통째로 바꾸며
# (c) 언제 무엇이 들어갔는지 나중에 답할 수 있어야 한다. 컨테이너 시작 훅에 숨기면
# 파드가 뜰 때마다 돌고, 롤링 업데이트 중에 두 파드가 동시에 인입하며, 실패해도
# "파드가 왜 안 뜨지"로만 보인다. **감사 가능한 별도 단계로 둔다.**
#
# ★ 이게 없으면 챗봇은 조용히 쓸모없다 ★ 배포는 성공하고 헬스체크도 초록인데,
# 벡터 저장소가 비어 있어 모든 질문에 "문서를 찾을 수 없다"고 답한다.
# 에러가 아니라 **그럴듯한 오답**이라 모니터링에 아무것도 안 걸린다.
#
# Job은 불변이라 재실행하려면 지우고 다시 만든다 (migrate-job.yaml과 동일):
#   kubectl delete job/ingest -n study-app --ignore-not-found
#   kubectl apply -f k8s/base/ingest-job.yaml
# 재인입은 멱등이다(같은 source의 옛 청크를 지우고 새로 넣는다) — 몇 번을 돌려도
# 중복이 쌓이지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  namespace: study-app
spec:
  backoffLimit: 1   # 인입은 비싸다(모델 다운로드 + 임베딩). 무한 재시도로 비용을 태우지 않는다
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          # base/kustomization.yaml의 resources에 없어서 overlays의 images: 트랜스폼을
          # 못 받는다 — migrate-job.yaml과 완전히 같은 사정이고, 로컬에서 돌릴 때는
          # 같은 방식으로 sed 치환하거나 이 태그를 직접 바꾼다.
          image: ghcr.io/kimmj6079/react-python-backend:latest
          imagePullPolicy: IfNotPresent
          # ★ 문서 경로가 이미지 안의 경로다 ★ backend/Dockerfile이 /app에 소스를 넣고,
          # CLAUDE.md·SETUP.md·DEPLOYMENT.md는 **저장소 루트**에 있어 backend 이미지에는
          # 들어 있지 않다. 그래서 아래 경로는 그대로는 동작하지 않는다 —
          # 이 Job을 실제로 쓰려면 셋 중 하나를 골라야 한다:
          #   (a) 인입할 문서를 ConfigMap으로 만들어 마운트한다 (문서가 작을 때)
          #   (b) backend 이미지에 문서를 COPY한다 (Dockerfile 한 줄)
          #   (c) 운영에서는 문서를 파일이 아니라 M11의 업로드 API로 넣는다 ← 실무 기본값
          # 학습용으로는 (a)를 쓴다 — 아래 volumeMounts가 그것이다.
          command:
            - python
            - -m
            - app.rag.ingest
            - /docs/CLAUDE.md
            - /docs/SETUP.md
            - /docs/DEPLOYMENT.md
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: docs
              mountPath: /docs
            - name: model-cache
              mountPath: /var/cache/fastembed   # configmap.yaml의 FASTEMBED_CACHE_PATH와 같아야 한다
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # backend Deployment와 같은 이유로 크다 — 인입은 임베딩 모델을
              # **반드시** 올린다(질의 경로와 달리 lazy가 아니라 확실히 쓴다).
              cpu: "2"
              memory: 2Gi
      volumes:
        # 인입할 문서. 아래 명령으로 만든다(저장소 루트에서):
        #   kubectl create configmap rag-docs -n study-app \
        #     --from-file=CLAUDE.md --from-file=SETUP.md --from-file=DEPLOYMENT.md
        # ★ ConfigMap은 1MiB 상한이 있다 ★ 문서가 커지면 여기서 막힌다 —
        # 그 순간이 위 (c)(업로드 API)로 옮겨야 할 때다.
        - name: docs
          configMap:
            name: rag-docs
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
