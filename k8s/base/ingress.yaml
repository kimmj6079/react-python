# nip.io resolves *.127.0.0.1.nip.io to 127.0.0.1, so this works against
# `minikube tunnel` / port-forward without editing /etc/hosts.
# (한글) nip.io는 *.127.0.0.1.nip.io 같은 도메인을 자동으로 127.0.0.1로
# 풀어주는 공개 DNS 서비스라, /etc/hosts를 직접 편집하지 않고도 로컬에서
# 그럴듯한 도메인으로 접속해볼 수 있다. (overlays/prod는 이 host 값을
# VM 공인 IP 기반 nip.io 주소로 patch해서 같은 트릭을 재사용한다.)
#
# No rewrite-target: the full path (e.g. /api/v1/items) is forwarded
# unchanged, matching the backend's actual route (api_v1_prefix=/api/v1).
# (한글) 경로를 잘라내는 rewrite-target 설정이 없다 -- 예를 들어
# /api/v1/items 요청이 그대로 backend에 /api/v1/items로 전달된다. 백엔드
# 라우터가 실제로 그 경로(api_v1_prefix=/api/v1)를 그대로 쓰기 때문에
# 잘라낼 필요가 없다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: study-app
spec:
  ingressClassName: nginx   # minikube의 ingress addon, 또는 별도 설치한 ingress-nginx가 처리
  rules:
    - host: app.127.0.0.1.nip.io   # overlays/prod가 VM 공인 IP 기반 주소로 patch함
      http:
        paths:
          - path: /api   # /api로 시작하는 요청은 backend Service로
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /   # 그 외 나머지 전부는 frontend(정적 파일) Service로
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
