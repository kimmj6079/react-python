# Jobs are immutable once created. To re-run after a new migration:
#   kubectl delete job/migrate -n study-app --ignore-not-found
#   kubectl apply -k k8s/overlays/dev
# (한글) k8s Job은 한 번 만들어지면 spec을 수정할 수 없다(불변). 새 마이그레이션이
# 추가된 뒤 다시 실행하려면 위 두 줄처럼 기존 Job을 지우고 새로 만들어야 한다.
# 이 파일이 k8s/base/kustomization.yaml의 resources 목록에 없는 것도 같은
# 이유 -- 목록에 있으면 재실행 시 `kubectl apply -k`가 불변 필드 수정 에러로 실패한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: study-app
spec:
  backoffLimit: 2   # Pod이 실패하면 최대 2번까지 더 재시도 (총 3번) 후 Job을 Failed로 표시
  template:
    spec:
      restartPolicy: Never   # Job Pod의 정석 설정: 실패해도 Pod 자체를 재시작하지 않고 새 Pod을 만듦
      containers:
        - name: migrate
          # resources:에 없어 overlays/dev·prod의 images: 트랜스폼을 못 받는다.
          # 그래서 scripts/deploy-local.*와 ci.yml이 kubectl apply 전에 sed로
          # 이 태그를 직접 치환한다 (CLAUDE.md 참고).
          image: ghcr.io/kimmj6079/react-python-backend:latest
          imagePullPolicy: IfNotPresent
          # ★ M5-2에서 한 줄이 늘었다 ★ 스키마를 바꾸는 일은 전부 이 Job이 한다.
          #   alembic upgrade head          — 우리가 정의한 테이블(items · document_chunks · documents)
          #   app.db.checkpointer_setup     — langgraph가 정의한 대화 체크포인트 테이블
          #
          # 두 마이그레이션 체계가 나란히 도는 것이 이상해 보이지만 의도한 것이다.
          # 체크포인터 테이블의 스키마는 **langgraph가 소유**하고 자기 버전 테이블
          # (checkpoint_migrations)로 관리한다. 그걸 alembic 리비전으로 베껴 쓰면
          # 라이브러리를 올리는 날 어긋난다 — **남의 스키마를 우리 마이그레이션에
          # 복사하지 않는다.** 우리가 정하는 것은 "언제 돌리는가"뿐이고, 그 답이 여기다.
          #
          # `&&`를 쓰려면 셸이 필요해서 command가 sh -c 형태가 됐다.
          # 앞이 실패하면 뒤는 안 돈다 — 순서가 의미를 갖는다(둘 다 같은 DB를 만진다).
          command: ["sh", "-c", "alembic upgrade head && python -m app.db.checkpointer_setup"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
