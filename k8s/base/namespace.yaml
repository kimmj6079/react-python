# 이 프로젝트의 모든 k8s 리소스가 속하는 네임스페이스. base/kustomization.yaml의
# `namespace: study-app` 덕분에 다른 매니페스트들엔 namespace 필드를 일일이
# 안 적어도 자동으로 이 네임스페이스에 배치된다(각 파일에 남아있는
# `namespace: study-app`은 그래서 사실상 중복이지만, kustomize 없이 파일만
# 봐도 이해되도록 남겨둔 것).
apiVersion: v1
kind: Namespace
metadata:
  name: study-app   # kubectl get pods -n study-app 처럼 -n 옵션으로 지정하는 이름
