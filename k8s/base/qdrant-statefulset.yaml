# 벡터 저장소(Qdrant). Postgres와 같은 이유로 Deployment가 아니라 StatefulSet이다 —
# 인입해둔 벡터가 재시작을 넘어 살아남아야 하고, 그러려면 Pod마다 고정된 PVC가 필요하다.
#
# ★ M5에서 이 파일이 새로 생겼다. 왜 여태 없었나 ★
# M3에서 Qdrant를 도입할 때 로컬 docker-compose에만 추가했고, M8에서 측정 결과를 보고
# `VECTOR_STORE` 기본값을 pgvector → qdrant로 바꿨다. 그런데 **배포 경로에는 Qdrant가
# 없었다.** 즉 지금 배포하면 backend가 `http://localhost:6333`으로 붙으려다 실패하고,
# 챗봇이 "문서를 찾을 수 없다"고 답한다 — 에러가 아니라 **그럴듯한 오답**이라
# 배포해놓고도 한참 모를 수 있는 종류의 고장이다.
#
# ★ pgvector로 되돌리는 선택지도 여전히 살아 있다 ★ Postgres가 이미 떠 있으니
# configmap.yaml의 VECTOR_STORE를 pgvector로 바꾸면 이 파일 없이도 돈다.
# 대가는 M8의 하이브리드 검색(dense+BM25 RRF)을 잃는 것이다 — 실측으로
# MRR 0.860 → 0.816, keyword MRR 1.000 → 0.893. **그걸 알고 고르는 것이 요점이다.**
# 여기서 Qdrant를 고른 이유: M8~M13의 모든 기준선이 qdrant에서 측정됐고,
# evals.yml의 회귀 게이트도 qdrant로 돈다. **운영이 측정한 적 없는 구성으로 도는 것**이
# 인프라 하나 줄이는 것보다 비싸다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: study-app
spec:
  serviceName: qdrant   # 같은 이름의 headless Service(qdrant-service.yaml)와 짝
  replicas: 1   # 학습용 단일 인스턴스. Qdrant는 분산 모드가 있지만 범위 밖이다
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          # ★ 태그를 고정한다 ★ docker-compose.yml과 같은 버전으로 맞춘다 —
          # latest는 어제와 오늘이 다른 버전이라 "실측 결과의 유효기간"을 말할 수 없다.
          image: qdrant/qdrant:v1.19.1
          ports:
            - name: http
              containerPort: 6333   # REST API + 웹 대시보드
            - name: grpc
              containerPort: 6334   # gRPC (qdrant-client가 prefer_grpc=True일 때)
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage   # Qdrant가 실제 벡터/페이로드를 저장하는 경로
          readinessProbe:
            httpGet:
              path: /readyz   # 통과해야 Service 엔드포인트에 포함된다
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez   # 계속 실패하면 kubelet이 컨테이너를 재시작한다
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # ★ 이 값은 벡터 수에 비례해서 커진다 ★ 지금 말뭉치는 138청크 ×
              # 1024차원이라 수 MB 수준이고 512Mi면 넘친다. 문서를 수천 개로 늘리면
              # 여기와 아래 storage를 함께 올려야 한다 — Qdrant는 기본적으로 인덱스를
              # 메모리에 올린다(on-disk 옵션이 따로 있다).
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
