# 이 앱(react-python)의 서버 블록. __APP_DOMAIN__은 실제 값이 아니라 순수한
# 플레이스홀더 문자열이며, scripts/deploy-prod-compose.sh(.ps1)가 배포 시점에
# .env.prod의 DOMAIN 값으로 치환한다 - DOMAIN이 비어있으면(지금, 테스트 단계)
# app.<VM_PUBLIC_IP>.nip.io로 자동 계산되고, DOMAIN을 채우면(나중에, 운영 단계)
# 그 실제 도메인이 그대로 쓰인다(k8s/overlays/prod/ingress-host-patch.yaml의
# __VM_PUBLIC_IP__와 동일한 "배포 시점 치환" 패턴).
#
# 다른 앱(예: Spring Boot)을 이 서버에 추가로 올릴 때는 이 파일을 건드리지 않고
# 이 디렉터리에 server_name이 다른 conf 파일을 하나 더 추가하면 된다
# (예: spring.conf의 server_name spring.__APP_DOMAIN__).

# ── HTTP (지금 활성 상태) ────────────────────────────────────────────
# SSL 인증서(nginx-proxy/ssl/README.md 참고)를 설치한 뒤에는: 이 블록을 지우거나
# 주석 처리하고, 아래 "HTTP → HTTPS 리다이렉트" + "HTTPS" 두 블록의 주석을
# 해제할 것.
server {
    listen 80;
    server_name __APP_DOMAIN__;

    # /api 요청은 backend 컨테이너로 프록시한다. proxy_pass 뒤에 경로를 붙이지
    # 않아 원본 URI(/api/... prefix)가 그대로 보존된다 - k8s Ingress의
    # "rewrite 없음" 동작과 동일.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지 전부는 frontend 컨테이너(nginx, 정적 SPA 빌드)로 프록시한다.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTP → HTTPS 리다이렉트 (SSL 인증서 설치 후 활성화) ──────────────────
# SSL 인증서 설치 후 위 "HTTP" 블록 대신 이걸 활성화할 것 - HTTP로 들어오는
# 요청을 전부 HTTPS로 301 리다이렉트한다. 지금은 인증서가 없어 활성화하면
# 안 되므로 주석 처리해둔다.
#
# server {
#     listen 80;
#     server_name __APP_DOMAIN__;
#     return 301 https://$host$request_uri;
# }

